# Weap Leads (servidor leads01). Subir: docker compose up -d --build
services:
  db:
    image: postgres:16
    shm_size: 1g
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=1GB", "-c", "wal_level=minimal", "-c", "max_wal_senders=0"]
    volumes:
      - dados:/var/lib/postgresql/data
      - ./banco/01-estrutura.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro

  app:
    build: ./app
    restart: unless-stopped
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_NAME: leads
      DB_USER: leads
      DB_PASSWORD: ${DB_PASSWORD}
      AGENTE_DB_HOST: ${AGENTE_DB_HOST:-}
      AGENTE_DB_PORT: ${AGENTE_DB_PORT:-5432}
      AGENTE_DB_NAME: ${AGENTE_DB_NAME:-weap_sdr}
      AGENTE_DB_USER: ${AGENTE_DB_USER:-}
      AGENTE_DB_PASSWORD: ${AGENTE_DB_PASSWORD:-}

  # CRM novo (FastAPI + React), em crm.weap.com.br. Código em ./crm (pasta crm/ do repositório).
  api:
    build:
      context: ./crm
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on: [db]
    command: ["bash", "-c", "alembic upgrade head && python app/initial_data.py && fastapi run --workers 2 app/main.py"]
    environment:
      PROJECT_NAME: Weap Leads
      ENVIRONMENT: production
      FRONTEND_HOST: https://${DOMINIO_CRM:-crm.weap.com.br}
      SECRET_KEY: ${CRM_SECRET_KEY:?Falta CRM_SECRET_KEY no .env}
      FIRST_SUPERUSER: ${CRM_ADMIN_EMAIL:?Falta CRM_ADMIN_EMAIL no .env}
      FIRST_SUPERUSER_PASSWORD: ${CRM_ADMIN_SENHA:?Falta CRM_ADMIN_SENHA no .env}
      POSTGRES_SERVER: db
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      AGENTE_DB_URL: ${AGENTE_DB_URL:-}

  web:
    build:
      context: ./crm
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, api, web]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:-leads.weap.com.br}
      DOMINIO_CRM: ${DOMINIO_CRM:-crm.weap.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  importador:
    build: ./importador
    profiles: ["importar"]          # só roda quando chamado (cron mensal)
    depends_on: [db]
    environment:
      PGHOST: db
      PGDATABASE: leads
      PGUSER: leads
      PGPASSWORD: ${DB_PASSWORD}
      RECEITA_UFS: ${RECEITA_UFS:-PR,SP}
      RECEITA_PASTA: /baixados
    volumes:
      - baixados:/baixados

volumes:
  dados:
  caddy:
  baixados:
